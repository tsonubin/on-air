# Per-user Flatpak for the on-air desktop app.
# GNOME 51 supplies WebKitGTK 4.1. Tray support comes from Flathub's
# libappindicator module (packaging/install.sh clones shared-modules).
# packaging/install.sh flatpak rewrites the git source to the local checkout.
# Audio helpers run on the host; see on-air-desktop.sh.
id: com.shay.on-air
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: on-air-desktop
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.login1
  - --system-talk-name=org.bluez
modules:
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json
  - name: on-air
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/on-air/cargo
    build-commands:
      - bash build.sh
    sources:
      - type: git
        url: https://github.com/tsonubin/on-air.git
        tag: v0.2.0
      - type: file
        path: build.sh
      - type: file
        path: on-air-desktop.sh
      - type: file
        path: com.shay.on-air.metainfo.xml
      - type: file
        path: com.shay.on-air.desktop
