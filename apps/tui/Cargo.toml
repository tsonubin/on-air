[package]
name = "on-air-tui"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tsonubin/on-air"
description = "on-air terminal UI and CLI for the on-air-core service"

[lib]
path = "src/lib.rs"

[[bin]]
name = "on-air"
path = "src/main.rs"

[dependencies]
on-air-api = { path = "../../packages/api" }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-tungstenite = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
unicode-width = "0.2"

[dev-dependencies]
on-air-core = { path = "../../packages/core" }
