[package]
name = "on-air-core"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rubato = "5.0.0"
audioadapter-buffers = "5.2.0"
async-trait = "0.1.92"
bytes = "1"
ringbuf = "0.5.1"
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
