[package]
name = "on-air-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tsonubin/on-air"
description = "on-air core: LAN audio capture, DSP and exclusive Sonos/AirPlay/Bluetooth senders behind an HTTP/WebSocket control plane"

[lib]
path = "src/lib.rs"

[[bin]]
name = "on-air-core"
path = "src/bin/on-air-core.rs"

[dependencies]
on-air-api = { path = "../api" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rubato = "5.0.0"
audioadapter-buffers = "5.2.0"
async-trait = "0.1.92"
bytes = "1"
getrandom = "0.4"
ringbuf = "0.5.1"
tokio-stream = { version = "0.1.19", features = ["sync", "time"] }
cpal = "0.18.2"
reqwest = { version = "0.13", features = ["json", "stream"] }
mdns-sd = "0.21"
tower-http = { version = "0.7", features = ["cors"] }
thiserror = "2"
parking_lot = "0.12"
subtle = "2"
gethostname = "1"
if-addrs = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
tokio-tungstenite = "0.30.0"
