name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: cargo test (core)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install ALSA (cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev pkg-config
      - name: Test core
        run: cargo test -p on-air-core

  check-desktop:
    name: cargo check (desktop)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # version comes from package.json "packageManager"; do not also pin it here
      # (pnpm/action-setup errors with "Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libasound2-dev libssl-dev pkg-config
      - run: pnpm install
      - name: Check desktop crate
        run: cargo check -p on-air-desktop
