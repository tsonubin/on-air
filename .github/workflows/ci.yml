name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs this whole workflow before it builds a tag.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  EXPO_NO_TELEMETRY: "1"

jobs:
  check-web:
    name: biome / typecheck / JS tests and bundles
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Check native project contracts
        run: node --test e2e/mobile/native-project.test.mjs
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm check:ci
      - name: Typecheck web workspaces
        run: pnpm typecheck:web
      - name: Test control client and mobile UI
        run: pnpm test:mobile
      - name: Test desktop frontend
        run: pnpm --filter desktop test
      - name: Build desktop frontend
        run: pnpm --filter desktop build
      - name: Bundle Expo app for iOS and Android
        run: |
          pnpm --filter mobile exec expo export --platform ios --output-dir "${{ runner.temp }}/on-air-expo-export-ios" --clear --max-workers 2
          pnpm --filter mobile exec expo export --platform android --output-dir "${{ runner.temp }}/on-air-expo-export-android" --max-workers 2

  test-core:
    name: fmt / clippy / core tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - uses: swatinem/rust-cache@v2
      - name: Install ALSA (cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev pkg-config
      - name: Lint core
        run: cargo clippy --locked -p on-air-core --all-targets -- -D warnings
      - name: Test core
        run: cargo test --locked -p on-air-core

  e2e-mobile:
    name: phone client e2e against the mock core
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: swatinem/rust-cache@v2
      - name: Install ALSA (cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - name: Build the mock core
        run: cargo build --locked -p on-air-core --bin on-air-core
      - name: Test phone client against the mock core
        run: pnpm test:mobile:e2e

  e2e-desktop:
    name: desktop e2e (Playwright api + ui) against the mock core
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: swatinem/rust-cache@v2
      - name: Install ALSA (cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libssl-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @on-air/e2e exec playwright install --with-deps chromium
      - name: Build the mock core
        run: cargo build --locked -p on-air-core --bin on-air-core
      - name: Test desktop API and UI against the mock core
        run: pnpm test:desktop:e2e
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: e2e/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  check-desktop:
    name: clippy / tests (workspace, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      # version comes from package.json "packageManager"; do not also pin it here
      # (pnpm/action-setup errors with "Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # One Cargo workspace at the repo root covers core and the desktop shell.
      - uses: swatinem/rust-cache@v2
      - name: Install Linux Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libasound2-dev libssl-dev pkg-config
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds apps/desktop/dist, so build it first.
      - name: Build desktop frontend
        run: pnpm --filter desktop build
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace

  build-mobile-android:
    name: build Android debug app
    needs: check-web
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Compile Android app and native modules
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64

  build-mobile-ios:
    name: build iOS simulator app
    needs: check-web
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile
      - run: pnpm install --frozen-lockfile
      - name: Install iOS pods
        working-directory: apps/mobile
        run: bundle exec pod install --project-directory=ios
      - name: Compile iOS app and native modules
        working-directory: apps/mobile
        run: >-
          xcodebuild
          -workspace ios/OnAirMobile.xcworkspace
          -scheme OnAirMobile
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "${{ runner.temp }}/on-air-ios"
          CODE_SIGNING_ALLOWED=NO
          build
