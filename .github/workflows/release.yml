name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Flow: CI checks -> build every platform into a draft release -> upload the
# headless core binaries -> SHA256SUMS -> publish the draft. A failure at any
# step leaves the release as a draft, so nothing half-built is ever public.
jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: ${{ matrix.name }}
    needs: ci
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            platform: macos-latest
            rust_target: aarch64-apple-darwin
            bundles: dmg
            os_name: macos
            arch_name: aarch64
          - name: macos-x86_64
            platform: macos-latest
            rust_target: x86_64-apple-darwin
            bundles: dmg
            os_name: macos
            arch_name: x86_64
          - name: linux-x86_64
            platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            os_name: linux
            arch_name: x86_64
          - name: linux-aarch64
            platform: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            os_name: linux
            arch_name: aarch64
          - name: windows-x86_64
            platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            os_name: windows
            arch_name: x86_64
          - name: windows-aarch64
            platform: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            bundles: nsis,msi
            os_name: windows
            arch_name: aarch64
    steps:
      - uses: actions/checkout@v5
      # version comes from package.json "packageManager"; do not also pin it here
      # (pnpm/action-setup errors with "Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      # One Cargo workspace at the repo root covers core and the desktop shell.
      - uses: swatinem/rust-cache@v2
      - name: Install Linux bundle deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev libasound2-dev libssl-dev pkg-config \
            rpm file libfuse2 xdg-utils desktop-file-utils
      - run: pnpm install --frozen-lockfile
      - name: App version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # Every manifest that carries a version must match tauri.conf.json.
          # (No associative arrays: macOS runners may still ship bash 3.2.)
          cargo_version() { sed -n 's/^version = "\([^"]*\)"/\1/p' "$1" | head -1; }
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mismatch=0
          check() {
            if [ "$2" != "$version" ]; then
              echo "Version mismatch: $1=$2, tauri.conf.json=$version" >&2
              mismatch=1
            fi
          }
          check apps/desktop/package.json "$(node -p "require('./apps/desktop/package.json').version")"
          check apps/desktop/src-tauri/Cargo.toml "$(cargo_version apps/desktop/src-tauri/Cargo.toml)"
          check packages/core/Cargo.toml "$(cargo_version packages/core/Cargo.toml)"
          check apps/mobile/package.json "$(node -p "require('./apps/mobile/package.json').version")"
          check apps/mobile/app.json "$(node -p "require('./apps/mobile/app.json').expo.version")"
          [ "$mismatch" = 0 ] || exit 1
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Build headless core binary
        run: cargo build --locked -p on-air-core --release --bin on-air-core --target ${{ matrix.rust_target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: "on-air v__VERSION__"
          releaseBody: |
            Installer packages (not a source-only release). GitHub also attaches
            an automatic source zip/tarball; use the files below to install.

            **macOS**
            - Apple silicon: `on-air-desktop___VERSION___aarch64.dmg`
            - Intel: `on-air-desktop___VERSION___x64.dmg`

            **Windows**
            - x64: `on-air-desktop___VERSION___x64-setup.exe`, `on-air-desktop___VERSION___x64_en-US.msi`, `on-air-desktop___VERSION___x64-portable.zip`
            - arm64: `on-air-desktop___VERSION___arm64-setup.exe`, `on-air-desktop___VERSION___arm64_en-US.msi`, `on-air-desktop___VERSION___arm64-portable.zip`

            **Linux**
            - x86_64: `on-air-desktop___VERSION___amd64.deb`, `on-air-desktop-__VERSION__-1.x86_64.rpm`, `on-air-desktop___VERSION___amd64.AppImage`
            - arm64: `on-air-desktop___VERSION___arm64.deb`, `on-air-desktop-__VERSION__-1.aarch64.rpm`, `on-air-desktop___VERSION___aarch64.AppImage`

            Headless core binaries are `on-air-core-serve-<os>-<arch>`. See INSTALL.md.

            Built from `${{ github.sha }}`.
          # Published by the `release` job once every platform, the extras
          # and SHA256SUMS are uploaded.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}
      - name: Verify installer bundles
        shell: bash
        run: |
          set -euo pipefail
          find target -type f -path '*/release/bundle/*' | tee /tmp/bundles.txt
          case "${{ matrix.os_name }}" in
            macos)
              grep -E '\.dmg$' /tmp/bundles.txt
              ;;
            linux)
              grep -E '\.deb$' /tmp/bundles.txt
              grep -E '\.rpm$' /tmp/bundles.txt
              grep -E '\.AppImage$' /tmp/bundles.txt
              ;;
            windows)
              grep -E 'setup\.exe$' /tmp/bundles.txt
              grep -E '\.msi$' /tmp/bundles.txt
              ;;
          esac
      - name: Stage extra artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-extra
          version="${{ steps.ver.outputs.version }}"
          rust_target="${{ matrix.rust_target }}"
          os_name="${{ matrix.os_name }}"
          arch_name="${{ matrix.arch_name }}"

          if [ "$os_name" = windows ]; then
            core_src="target/${rust_target}/release/on-air-core.exe"
            core_dest="dist-extra/on-air-core-serve-${os_name}-${arch_name}.exe"
            winarch=x64
            [ "$arch_name" = aarch64 ] && winarch=arm64
            exe="target/${rust_target}/release/on-air-desktop.exe"
            if [ ! -f "$exe" ]; then
              exe=$(find target -name on-air-desktop.exe -path '*/release/*' ! -path '*/deps/*' | head -1)
            fi
            if [ -z "$exe" ] || [ ! -f "$exe" ]; then
              echo "on-air-desktop.exe not found" >&2
              exit 1
            fi
            py=python3
            command -v python3 >/dev/null 2>&1 || py=python
            "$py" -c 'import sys, zipfile, pathlib; src, dest = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]); zf = zipfile.ZipFile(dest, "w", zipfile.ZIP_DEFLATED); zf.write(src, "on-air-desktop.exe"); zf.close(); print("wrote", dest, "from", src)' \
              "$exe" "dist-extra/on-air-desktop_${version}_${winarch}-portable.zip"
          else
            core_src="target/${rust_target}/release/on-air-core"
            core_dest="dist-extra/on-air-core-serve-${os_name}-${arch_name}"
          fi

          if [ ! -f "$core_src" ]; then
            echo "on-air-core binary not found at $core_src" >&2
            find target -maxdepth 3 -name 'on-air-core*' -path '*/release/*' || true
            exit 1
          fi
          cp "$core_src" "$core_dest"
          ls -la dist-extra
      # Don't PATCH the GitHub Release from matrix jobs (GITHUB_TOKEN cannot
      # update-a-release on workflow_dispatch). Stage extras as build artifacts
      # and upload them in a single follow-up job.
      - uses: actions/upload-artifact@v4
        with:
          name: extra-${{ matrix.name }}
          path: dist-extra/*
          if-no-files-found: error
          retention-days: 3

  extras:
    name: upload extras
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: extra-*
          merge-multiple: true
          path: dist-extra
      - name: Upload extras to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la dist-extra
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          gh release upload "v${version}" dist-extra/* --clobber

  checksums:
    name: publish SHA256SUMS
    needs: [publish, extras]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Hash release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mkdir -p /tmp/rel
          gh release download "v${version}" --dir /tmp/rel --pattern '*'
          (cd /tmp/rel && sha256sum -- * | grep -v ' SHA256SUMS$' > SHA256SUMS)
          gh release upload "v${version}" /tmp/rel/SHA256SUMS --clobber
          cat /tmp/rel/SHA256SUMS

  release:
    name: publish release
    needs: [publish, extras, checksums]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          gh release edit "v${version}" --draft=false
